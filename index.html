<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Cadet Dream – Support</title>
<style>
:root { color-scheme: light dark; --bg: #F4F3EF; --surface: #FFFFFF; --ink: #14213D; --ink2: #3C4A63; --muted: #606E81; --line: #DCE1E9; --accent: #2F6BD6; }
@media (prefers-color-scheme: dark) { :root { --bg: #0F1623; --surface: #182236; --ink: #EEF1F6; --ink2: #C4CCDA; --muted: #8A96AA; --line: #2C3A54; --accent: #7FA3F0; } }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
}
main { max-width: 42rem; margin: 0 auto; padding: 24px 16px 64px; }
h1 { font-size: 1.75rem; line-height: 1.25; margin: 0 0 16px; }
h2 { font-size: 1.35rem; margin: 40px 0 8px; padding-top: 24px; border-top: 1px solid var(--line); }
h3 { font-size: 1.1rem; margin: 28px 0 4px; }
p, li { color: var(--ink2); }
ul { padding-left: 1.25rem; }
li + li { margin-top: 4px; }
a { color: var(--accent); text-underline-offset: 2px; }
a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 2px; }
code { font-size: 0.9em; }
nav ul { list-style: none; padding: 0; margin: 0 0 8px; display: flex; flex-wrap: wrap; gap: 4px 20px; }
nav a { display: inline-flex; align-items: center; min-height: 44px; }
.draft { margin: 0 0 16px; padding: 4px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.draft p { color: var(--ink); }
.home { color: var(--muted); }
</style>
</head>
<body>
<main>
<h1>Cadet Dream · <span lang="zh-Hant">支援</span></h1>
<section lang="en">
<p>Cadet Dream helps Hong Kong cadet-pilot applicants prepare for airline interviews. Questions or problems: <a href="mailto:support@cadetdream.com">support@cadetdream.com</a></p>
</section>
<section lang="zh-Hant">
<p>Cadet Dream 協助香港見習機師申請人準備航空公司面試。如有疑問或遇到問題，請電郵 <a href="mailto:support@cadetdream.com">support@cadetdream.com</a>。</p>
</section>
<ul>
  <li><a href="/privacy">Privacy Policy</a> · <a href="/privacy#zh-Hant" lang="zh-Hant">私隱政策</a></li>
  <li><a href="/terms">Terms of Use</a> · <a href="/terms#zh-Hant" lang="zh-Hant">使用條款</a></li>
</ul>
</main>
</body>
</html>
